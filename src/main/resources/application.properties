spring.application.name=project20-sor

sor.pacjent-gov.base-url=https://pacjent.gov.pl
sor.pacjent-gov.user-agent=project20-sor/0.0.1
sor.pacjent-gov.timeout=8s

# Aktualny plik z listą odczytujemy ze strony z mapą (data w jego nazwie zmienia się przy aktualizacji);
# ścieżka niżej to tylko zapas, gdy strony nie da się odczytać.
sor.catalog.page-path=/szpitalny-oddzial-ratunkowy-sor
sor.catalog.path=/sites/pacjent/files/dane/Mapy-SOR-24.09.2026.json
sor.catalog.refresh-interval=24h
sor.catalog.retry-interval=1m

# Rodzaje SOR (ogólny / dla dzieci) z otwartego eksportu RPWDL
sor.rpwdl.base-url=https://rpwdl2.ezdrowie.gov.pl
sor.rpwdl.export-path=/api/rpwdl-public-resource/ledgers-zip/initial?fileTypeInsideZip=CSV&activityType=HEALTHCARE_PROVIDER&activeLedgers=true
sor.rpwdl.timeout=120s
sor.rpwdl.refresh-interval=7d
sor.rpwdl.retry-interval=10m

# Osobne wątki: długie pobieranie RPWDL nie może wstrzymywać odpytywania kolejek
spring.task.scheduling.pool.size=3

sor.queue.poll-interval=5m
sor.queue.initial-delay=10s
sor.queue.concurrency=4
sor.queue.stale-after=15m

# Szacunek zapasowy, gdy OSRM nie odpowie
sor.travel.detour-factor=1.3
sor.travel.average-speed-kmh=50
# Publiczny demo-serwer OSRM: do rozwoju, nie do ruchu produkcyjnego (limit ~1 zapytanie/s) — docelowo własna instancja
sor.travel.osrm.enabled=true
sor.travel.osrm.base-url=https://router.project-osrm.org
sor.travel.osrm.timeout=3s

sor.ranking.candidates=40
sor.ranking.max-without-data=5

sor.health.min-fresh-share=0.5
management.endpoint.health.show-details=always
