<!doctype html>
<html lang="pl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Najbliższy SOR</title>
	<meta name="description" content="Gdzie najszybciej trafisz do lekarza na SOR: dojazd i aktualne kolejki z pacjent.gov.pl.">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c62828'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
		integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
		crossorigin="anonymous" referrerpolicy="no-referrer">
	<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
	<aside class="panel">
		<header class="header">
			<h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>Najbliższy SOR</h1>
			<a class="emergency" href="tel:112"><span class="emergency-extra">Zagrożenie życia? </span><strong>Dzwoń 112</strong></a>
		</header>

		<section class="controls" aria-label="Wyszukiwanie">
			<button class="btn-primary" id="locate" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1 1 0 0 1 1 1v1.07A8 8 0 0 1 19.93 11H21a1 1 0 1 1 0 2h-1.07A8 8 0 0 1 13 19.930V21a1 1 0 1 1-2 0v-1.07A8 8 0 0 1 4.07 13H3a1 1 0 1 1 0-2h1.07A8 8 0 0 1 11 4.07V3a1 1 0 0 1 1-1Zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
				Użyj mojej lokalizacji
			</button>
			<form class="search" id="search" role="search" autocomplete="off">
				<label class="visually-hidden" for="address">Adres</label>
				<input type="search" id="address" name="q" placeholder="albo wpisz adres, np. Bursztynowa 2, Warszawa"
					minlength="3" maxlength="200" enterkeyhint="search">
				<button type="submit" class="btn-secondary">Szukaj</button>
				<ul class="suggestions" id="suggestions" role="listbox" aria-label="Znalezione adresy" hidden></ul>
			</form>
			<div class="filters">
				<div class="segmented" role="radiogroup" aria-label="Pacjent">
					<label><input type="radio" name="patient" value="ADULT" checked><span>Dorosły</span></label>
					<label><input type="radio" name="patient" value="CHILD"><span>Dziecko</span></label>
				</div>
				<label class="select">
					<span>Priorytet z triażu</span>
					<select id="priority">
						<option value="">nie wiem</option>
						<option value="HIGHEST">najwyższy</option>
						<option value="HIGH">wysoki</option>
						<option value="MEDIUM">średni</option>
						<option value="LOW">niski</option>
						<option value="LOWEST">najniższy</option>
					</select>
				</label>
			</div>
		</section>

		<div class="status" id="status" role="status" aria-live="polite"></div>
		<div class="list" id="list"></div>

		<footer class="footer">
			Kolejki: <a href="https://pacjent.gov.pl/szpitalny-oddzial-ratunkowy-sor" target="_blank" rel="noopener">pacjent.gov.pl</a>
			· rodzaje SOR: RPWDL · trasy autem: OSRM · komunikacja:
			<a href="https://transitous.org/sources/" target="_blank" rel="noopener">Transitous</a>
			· adresy: OpenStreetMap Nominatim
		</footer>
	</aside>
	<main class="map-wrap">
		<div id="map" aria-label="Mapa SOR"></div>
	</main>
</div>

<template id="intro">
	<div class="intro">
		<p class="intro-title">Gdzie najszybciej trafisz do lekarza?</p>
		<p>Pokażemy SOR uszeregowane według łącznego czasu: dojazdu po drogach i aktualnej kolejki do lekarza.</p>
		<p class="muted">Użyj lokalizacji, wpisz adres albo kliknij miejsce na mapie.</p>
	</div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
	integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="app.js"></script>
</body>
</html>
